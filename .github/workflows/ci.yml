name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            version: 22.19.0
          - node: 24
            version: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser regressions
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Test browser regressions with local mocks
        if: matrix.node == 24
        run: npm run test:ui
      - name: Test repository security administration
        if: matrix.node == 24
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  dotnet:
    name: .NET companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci --ignore-scripts
        working-directory: dotnet/frontend
      - run: npm run build && npm test
        working-directory: dotnet/frontend
      - run: dotnet restore Testklient.slnx --locked-mode
        working-directory: dotnet
      - run: dotnet build Testklient.slnx --no-restore
        working-directory: dotnet
      - run: dotnet test Testklient.slnx --no-build --no-restore
        working-directory: dotnet
      - run: npx playwright install --with-deps chromium
        working-directory: dotnet/frontend
      - run: npm run test:ui
        working-directory: dotnet/frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: bash scripts/scan-secrets.sh
